<div class="login-page">
  <form class="login-card" [formGroup]="form" (ngSubmit)="submit()">
    <h1>Pokémon Collection</h1>

    <p class="subtitle">Sign in as a trainer</p>

    <label for="email"> Email </label>
    <input
      id="email"
      type="email"
      formControlName="email"
      autocomplete="email"
      placeholder="trainer1@example.com"
    />

    @if (form.controls.email.touched && form.controls.email.invalid) {
      <p class="field-error">Please enter a valid email.</p>
    }

    <label for="password"> Password </label>

    <input
      id="password"
      type="password"
      formControlName="password"
      autocomplete="current-password"
      placeholder="Password"
    />

    @if (errorMessage()) {
      <p class="error">
        {{ errorMessage() }}
      </p>
    }

    <button type="submit" [disabled]="form.invalid || loading()">
      @if (loading()) {
        Signing in...
      } @else {
        Sign in
      }
    </button>
    <div class="demo">
      <strong>Demo account</strong>
      <span> trainer1@example.com </span>
      <span> Trainer123! </span>
    </div>
  </form>
</div>
